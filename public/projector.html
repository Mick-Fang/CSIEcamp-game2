<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椰子怪討伐戰 — 投影大螢幕</title>
    <link rel="stylesheet" href="/csiecamp_game2/css/style.css?v=1783411227">
    <style>
        body { background-color: var(--ocean-deep); color: #f8fafc; }
        .glass-card { background: rgba(2, 132, 199, 0.2); border-color: var(--card-border-dark); padding: 1.5rem; border-radius: 12px;}
        .team-box {
            background: rgba(2, 132, 199, 0.3); border: 2px solid var(--ocean-medium); border-radius: 12px; padding: 1rem; text-align: center;
            transition: all 0.3s ease;
        }
        .team-box.active { border-color: var(--ocean-medium); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .team-box.escaped { border-color: var(--success-green); opacity: 0.85; background: rgba(16, 185, 129, 0.1); }
        .team-box.dead { border-color: var(--danger-red); opacity: 0.4; filter: grayscale(1); }
        
        .teams-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.8rem; margin-top: 1rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container" style="max-width: 1700px; padding: 2rem; display: flex; flex-direction: column; min-height: 90vh; justify-content: space-between;">
        
        <!-- Header -->
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
            <h1 style="font-size: 2rem; color: #fde047; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">🥥 椰子怪討伐戰：生存逃脫</h1>
            <h2 style="font-size: 1.5rem; margin: 0; color: #cbd5e1;">第 <span id="proj-encounter">-</span> 隻遭遇</h2>
        </header>

        <!-- Main Content Area -->
        <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
            
            <!-- SETUP -->
            <div id="view-setup" style="text-align: center; display: none;">
                <h2 style="font-size: 4rem; color: var(--sunset-orange); margin-bottom: 1rem;">準備就緒！</h2>
                <p style="font-size: 2rem; color: #94a3b8;">等待主持人開始遊戲...</p>
            </div>

            <!-- ENCOUNTER -->
            <div id="view-encounter" style="display: none; text-align: center;">
                <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 0.5rem;">
                    <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 0.5rem;">
                        
                        <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 1rem;">
                            <img id="proj-monster-img" src="" alt="Monster" style="width: 120px; height: 120px; object-fit: cover; border-radius: 12px; border: 3px solid var(--danger-red); box-shadow: 0 5px 15px rgba(239,68,68,0.3);">
                            <div style="width: 150px; height: 150px;">
                                <canvas id="proj-monster-radar-chart"></canvas>
                            </div>
                        </div>
                        <div style="text-align: left;">
                            <h2 id="proj-monster-name" style="font-size: 1.8rem; color: #fff; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">-</h2>
                            <p id="proj-monster-desc" style="color: #cbd5e1; font-size: 1rem; margin-top: 0.25rem;">-</p>
                        </div>
                    </div>
                    <div id="proj-cards-container" style="display: flex; flex-direction: row; justify-content: center; gap: 0.5rem; width: 100%; max-width: 1400px;">
                        <!-- Cards will be generated here -->
                    </div>
                </div>
                
                <div id="proj-result-text" style="font-size: 1.3rem; color: var(--sunset-yellow); min-height: 30px; font-weight: bold; background: rgba(0,0,0,0.3); padding: 0.25rem 1rem; border-radius: 12px; display: inline-block;"></div>
            </div>

            <!-- ROUND END -->
            <div id="view-round-end" style="text-align: center; display: none;">
                <h2 style="font-size: 4.5rem; color: var(--success-green); margin-bottom: 3rem; text-shadow: 0 4px 10px rgba(16,185,129,0.4);">🎉 遊戲結束：家中椰子結算 🎉</h2>
                <div id="round-end-leaderboard" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; text-align: left; max-width: 900px; margin: 0 auto; font-size: 1.8rem;">
                    <!-- End round stats -->
                </div>
            </div>

        </div>

        <!-- 隊伍狀態網格 (永遠在下方顯示) -->
        <div id="teams-grid" class="teams-grid"></div>

    </div>

    <script src="/csiecamp_game2/js/game.js?v=1783411227"></script>
    <script src="/csiecamp_game2/js/projector.js?v=1783411227"></script>
</body>
</html>
